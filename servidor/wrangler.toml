name = "tradutor-runeteria"
main = "worker.js"
compatibility_date = "2025-01-01"

# Memoria compartilhada das traducoes. O id sai do comando:
#   npx wrangler kv namespace create MEMORIA
[[kv_namespaces]]
binding = "MEMORIA"
id = "643a2c08345340c792de86eea8d47323"

# Segredos (nunca neste arquivo; o repositorio e publico):
#   npx wrangler secret put DEEPL_KEY     -> chave da API do DeepL (a gratuita termina em ":fx")
#   npx wrangler secret put ADMIN_TOKEN   -> senha para baixar a memoria (GET /memoria) e revisar
# Chave paga do DeepL: troque a URL abaixo para https://api.deepl.com/v2/translate
[vars]
DEEPL_URL = "https://api-free.deepl.com/v2/translate"
# caracteres por dia (500 mil por mes / 30 ~ 16 mil; o dia pode passar um pouco se o resto do mes sobrar)
LIMITE_DIA = "20000"
# caracteres por jogador por dia (protege a cota de quem tentar gastar de proposito)
LIMITE_IP_DIA = "5000"
